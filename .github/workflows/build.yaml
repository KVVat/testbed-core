name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TestbedCore-windows-latest
          - os: ubuntu-latest
            artifact_name: TestbedCore-ubuntu-latest
          - os: macos-latest
            artifact_name: TestbedCore-macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Distributable
        shell: bash
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Build MCP Bridge
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Create dummy xcodebuild to bypass missing Xcode issues on CI
            echo '#!/bin/bash
            if [ "$1" = "-version" ]; then
                echo "Xcode 15.0"
                echo "Build version 15A240d"
                exit 0
            fi
            exit 0' > /tmp/xcodebuild
            chmod +x /tmp/xcodebuild
            PATH=/tmp:$PATH ./gradlew :tools:mcp-bridge:assemble
          else
            ./gradlew :tools:mcp-bridge:assemble
          fi

      - name: Prepare Artifact (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "work/artifact" | Out-Null
          Copy-Item -Path "composeApp/build/compose/binaries/main-release/app" -Destination "work/artifact/app" -Recurse -Force
          Copy-Item -Path "tools/mcp-bridge/build/bin/mingwX64/releaseExecutable/mcp-bridge.exe" -Destination "work/artifact/mcp-bridge.exe" -Force

      - name: Prepare Artifact (Linux/macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/artifact
          tar -C composeApp/build/compose/binaries/main-release -czf work/artifact/app.tar.gz app
          
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp tools/mcp-bridge/build/bin/linuxX64/releaseExecutable/mcp-bridge.kexe work/artifact/mcp-bridge-linux
            chmod +x work/artifact/mcp-bridge-linux
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp tools/mcp-bridge/build/bin/macosArm64/releaseExecutable/mcp-bridge.kexe work/artifact/mcp-bridge-macos-arm64
            cp tools/mcp-bridge/build/bin/macosX64/releaseExecutable/mcp-bridge.kexe work/artifact/mcp-bridge-macos-x64
            chmod +x work/artifact/mcp-bridge-macos-arm64 work/artifact/mcp-bridge-macos-x64
          fi

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: work/artifact/**
          if-no-files-found: error
          retention-days: 14


