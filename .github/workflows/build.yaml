name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TestbedCore-windows-latest
          - os: ubuntu-latest
            artifact_name: TestbedCore-ubuntu-latest
          - os: macos-latest
            artifact_name: TestbedCore-macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Distributable
        shell: bash
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: composeApp/build/compose/binaries/main-release/app/**
          if-no-files-found: error
          retention-days: 14
